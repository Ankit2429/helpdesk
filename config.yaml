# Campus Helpdesk Configuration

app:
  env: "development"
  name: "Campus Helpdesk"
  version: "1.0.0"

retrieval:
  top_k: 50
  rerank_k: 5
  confidence_threshold: 0.75
  answerability_threshold: 0.70
  # IMPORTANT: distance_threshold is compared against the raw distance from the hybrid retriever.
  # BM25 scores are negative and FAISS L2 scores can be up to ~8. The old value of 2.0
  # incorrectly rejected valid top-RRF FAISS-dominated results, causing hallucination.
  # Set to 999.0 to disable the broken absolute filter; rely on RRF ranking + LLM grounding instead.
  distance_threshold: 999.0
  chunk_size: 800
  chunk_overlap: 120

cache:
  ttl_seconds: 7200

memory:
  max_history_turns: 3
  max_context_words: 1500

ollama:
  base_url: "http://localhost:11434"
  model: "nemotron-3-super:cloud"
  timeout_seconds: 180.0
  temperature: 0.0
  top_p: 0.8
  top_k: 40
  context_window: 2048
  max_output_tokens: 512

embedding:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  device: "cpu"
  batch_size: 32
  normalize: true

reranker:
  enabled: true
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_n: 50

logging:
  level: "INFO"

vision:
  confidence: 0.95
  min_hits: 3
  min_misses: 10
  queue_maxsize: 1
  frame_scale_width: 640
  detection_scale: 1.05
  detection_win_stride: [8, 8]
  detection_padding: [16, 16]

audio:
  stt_non_speaking_duration: 0.8
  stt_debug: false

vad:
  sample_rate_options: [8000, 16000, 32000, 48000]
  frame_duration_options: [10, 20, 30]

tts:
  dummy_speech_delay: 0.02
  dummy_speech_min_delay: 0.01
