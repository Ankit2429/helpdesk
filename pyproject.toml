[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campus-helpdesk"
version = "0.1.0"
description = "Offline-first backend for an autonomous campus helpdesk robot"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
dependencies = [
  "faiss-cpu>=1.8,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "langchain>=0.3,<1.0",
  "langchain-community>=0.3,<1.0",
  "langchain-core>=0.3,<1.0",
  "langchain-text-splitters>=0.3,<1.0",
  "ollama>=0.4,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "pypdf>=5.0,<6.0",
  "sentence-transformers>=3.0,<4.0",
  "opencv-python>=4.10,<5.0",
  "pillow>=10.0,<11.0",
  "pyttsx3>=2.90,<3.0",
  "faster-whisper>=1.0,<2.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.scripts]
campus-helpdesk-ingest = "campus_helpdesk.ingest:main"

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/campus_helpdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
